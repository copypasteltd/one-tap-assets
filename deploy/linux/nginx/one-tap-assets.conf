log_format ypcc_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
server {
    listen 38480;
    server_name 192.168.31.20;
    server_tokens off;
    location = /lan-ca.crt { root /opt/one-tap-assets/public; default_type application/x-x509-ca-cert; }
    location / { return 308 https://192.168.31.20:38443$request_uri; }
}
server {
    listen 38443 ssl;
    server_name 192.168.31.20;
    server_tokens off;
    ssl_certificate /root/cfg/one-tap-assets/tls/lan-chain.crt;
    ssl_certificate_key /root/cfg/one-tap-assets/tls/lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YPCC:10m;
    client_max_body_size 11m;
    access_log /var/log/nginx/one-tap-assets-access.log ypcc_safe;
    error_log /var/log/nginx/one-tap-assets-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { root /opt/one-tap-assets/public; try_files /index.html =404; add_header Cache-Control no-store; }
    location = /lan-ca.crt { root /opt/one-tap-assets/public; default_type application/x-x509-ca-cert; }
    location = /preview { return 308 /preview/; }
    location ^~ /preview/ { alias /opt/one-tap-assets/public/preview/; index index.html; autoindex off; add_header Cache-Control no-store; }
    location / {
        proxy_pass http://127.0.0.1:38410;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
